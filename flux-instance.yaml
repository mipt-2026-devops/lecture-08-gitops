apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    version: "2.10.x"
    registry: ghcr.io/fluxcd
  components:
    - source-controller
    - kustomize-controller
  sync:
    kind: GitRepository
    url: https://github.com/mipt-2026-devops/lecture-08-gitops.git
    ref: refs/heads/main
    path: clusters/kind
    interval: 1m
